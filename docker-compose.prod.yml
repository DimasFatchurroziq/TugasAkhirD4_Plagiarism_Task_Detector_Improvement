version: "3.9"

# ================================================================
# docker-compose.prod.yml — MODE PRODUCTION (untuk dosen)
#
# Perbedaan dengan development:
#   - Kode sudah ter-copy di dalam image (tidak butuh folder src/)
#   - Tidak ada live reload
#   - Lebih stabil dan cepat
#
# Cara pakai:
#   docker compose -f docker-compose.prod.yml up --build
# ================================================================

services:

  db:
    image: postgres:16-alpine
    container_name: plagiarism_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-plagiarism_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plagiarism_pass}
      POSTGRES_DB: ${DB_NAME:-plagiarism_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plagiarism_user} -d ${DB_NAME:-plagiarism_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plagiarism_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: prod
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-plagiarism_user}:${DB_PASSWORD:-plagiarism_pass}@db:5432/${DB_NAME:-plagiarism_db}
    ports:
      - "8000:8000"
    volumes:
      # Tidak ada volume mount kode — pakai kode dari dalam image
      - uploads_data:/app/uploads
      - model_cache:/model-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  model_cache:
