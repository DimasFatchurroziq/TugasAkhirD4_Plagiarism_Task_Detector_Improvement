version: "3.9"

# ================================================================
# docker-compose.yml — MODE DEVELOPMENT (untuk Anda)
#
# Perbedaan dengan production:
#   - Kode src/ di-mount langsung dari laptop → live reload bekerja
#   - Setiap Anda save file Python, FastAPI otomatis restart
#   - Tidak perlu docker compose build ulang saat ubah kode
#
# Cara pakai:
#   docker compose up --build      ← pertama kali
#   docker compose up              ← selanjutnya
# ================================================================

services:

  db:
    image: postgres:16-alpine
    container_name: plagiarism_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-plagiarism_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plagiarism_pass}
      POSTGRES_DB: ${DB_NAME:-plagiarism_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plagiarism_user} -d ${DB_NAME:-plagiarism_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plagiarism_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: dev
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-plagiarism_user}:${DB_PASSWORD:-plagiarism_pass}@db:5432/${DB_NAME:-plagiarism_db}
    ports:
      - "8000:8000"
    volumes:
      # ← Inilah kuncinya: folder src/ di laptop Anda di-mount ke container
      # Setiap file disimpan, uvicorn --reload langsung mendeteksi perubahan
      - ./src:/app/src
      - ./alembic:/app/alembic
      - uploads_data:/app/uploads
      - model_cache:/model-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  model_cache:
