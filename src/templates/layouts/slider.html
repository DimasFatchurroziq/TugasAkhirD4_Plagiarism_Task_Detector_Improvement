<div class="card p-4 shadow-sm" style="max-width: 500px; margin: 20px auto;">
    <h4 class="mb-4">Pengaturan Bobot Analisis Plagiarisme</h4>
    
    <!-- Indikator Angka Bobot -->
    <div class="d-flex justify-content-between mb-3 text-center font-weight-bold">
        <div class="text-danger">Eksak: <span id="txt-eksak">50</span>%</div>
        <div class="text-warning">Parafrase: <span id="txt-parafrase">30</span>%</div>
        <div class="text-primary">Elemen 3: <span id="txt-ketiga">20</span>%</div>
    </div>

    <!-- Tempat Slider Akan Muncul -->
    <div id="slider-bobot" class="mb-4" style="height: 15px;"></div>

    <!-- Form HTMX untuk Mengirim Data ke FastAPI -->
    <form hx-post="/save-config" hx-target="#response-message" hx-swap="innerHTML">
        <!-- Hidden Inputs yang nilainya akan diisi oleh Vanilla JS -->
        <input type="hidden" name="weight_exact" id="input-eksak" value="50">
        <input type="hidden" name="weight_paraphrase" id="input-parafrase" value="30">
        <input type="hidden" name="weight_third" id="input-ketiga" value="20">

        <div class="form-group mb-3">
            <label for="threshold">Threshold Plagiarisme Global (%)</label>
            <input type="number" name="threshold" id="threshold" class="form-control" value="25" min="1" max="100">
        </div>

        <button type="submit" class="btn btn-success w-100">Simpan Konfigurasi</button>
    </form>

    <!-- Tempat memunculkan pesan sukses/gagal dari FastAPI via HTMX -->
    <div id="response-message" class="mt-3"></div>
</div>

<!-- Kustomisasi Warna Jalur Slider via CSS -->
<style>
    /* Mengubah warna 3 area slider */
    .noUi-connect:nth-child(1) { background: #dc3545; } /* Merah - Eksak */
    .noUi-connect:nth-child(2) { background: #ffc107; } /* Kuning - Parafrase */
    .noUi-connect:nth-child(3) { background: #0d6efd; } /* Biru - Elemen 3 */
</style>
